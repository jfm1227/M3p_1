# configs/day7_multitask_full.yaml
# Day7: 25fps × CSV27本 中サイズ用マルチタスク学習 config

paths:
  train_samples: "out/day7/train_samples.v3.full.jsonl"
  val_samples:   "out/day7/val_samples.v3.full.jsonl"
  out_dir:       "out/exp_day7_multitask_full"

step_ms: 40

dataset:
  max_len: 160
  min_T: 1
  max_T: 200

model:
  emb_dim: 128
  n_layers: 4
  n_heads: 4
  ffn_dim: 256
  dropout: 0.1
  ncls: 6          # 6口型
  ncls_coarse: 3   # close / 横系 / 縦系
  multitask: true  # マルチタスク有効

train:
  batch_size: 32
  num_epochs: 20
  lr: 1.0e-3
  weight_decay: 1.0e-4
  label_smoothing: 0.05          # fine 用
  coarse_label_smoothing: 0.0    # coarse 用（必要なら調整）
  coarse_loss_weight: 0.3        # fine + 0.3 * coarse
  early_stop_patience: 5
  grad_clip: 1.0
  num_workers: 2
  seed: 42

device: "cuda"   # Codespaces では "cpu" / Jules では "cuda"
