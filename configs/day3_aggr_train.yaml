paths:
  train_samples: "out/day3/aggr/train_samples.jsonl"
  val_samples:   "out/day3/aggr/val_samples.jsonl"
  out_dir:       "out/exp_day3_aggr"

step_ms: 40

dataset:
  max_len: 160
  min_T: 1
  max_T: 200

model:
  emb_dim: 128
  n_layers: 4
  n_heads: 4
  ffn_dim: 256
  dropout: 0.1
  ncls: 6

train:
  batch_size: 32
  num_epochs: 20
  lr: 1.0e-3
  weight_decay: 1.0e-4
  label_smoothing: 0.05
  early_stop_patience: 5
  grad_clip: 1.0
  num_workers: 2
  seed: 42

device: "cuda"
