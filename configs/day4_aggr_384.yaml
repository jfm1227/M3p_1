paths:
  train_samples: out/day4/train_samples.v2.jsonl
  val_samples: out/day4/val_samples.v2.jsonl
  out_dir: out/exp_day4_aggr_384

step_ms: 40

dataset:
  max_len: 160
  min_T: 1
  max_T: 200

model:
  emb_dim: 384      # ★ 128 → 384
  n_layers: 4
  n_heads: 4
  ffn_dim: 768      # ★ emb_dim * 2 に揃える（もとの比率を維持）
  dropout: 0.1
  ncls: 6

train:
  batch_size: 32
  num_epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.05
  early_stop_patience: 5
  grad_clip: 1.0
  num_workers: 2
  seed: 42

device: cuda
