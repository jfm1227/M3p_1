paths:
  train_samples: "out/day4/train_samples.v2.jsonl"
  val_samples:   "out/day4/val_samples.v2.jsonl"
  out_dir:       "out/exp_day6_focal_weighted"

step_ms: 40

dataset:
  max_len: 160
  min_T: 1
  max_T: 200

model:
  emb_dim: 128
  n_layers: 4
  n_heads: 4
  ffn_dim: 256
  dropout: 0.1
  ncls: 6

train:
  batch_size: 32
  num_epochs: 20
  lr: 1.0e-3
  weight_decay: 1.0e-4

  # focal では一旦 label_smoothing を 0 にしてシンプルに
  label_smoothing: 0.0

  early_stop_patience: 5
  grad_clip: 1.0
  num_workers: 2
  seed: 42

  # Day6: focal + class_weight
  loss_type: "focal"
  class_weight: [3.0, 0.5, 5.0, 2.0, 0.7, 2.5]
  focal_gamma: 1.5

device: "cuda"
